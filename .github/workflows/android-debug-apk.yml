name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/RastreadorVeicular/**'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Write Firebase Android configuration
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          test -n "$FIREBASE_ANDROID_CONFIG"
          printf '%s' "$FIREBASE_ANDROID_CONFIG" > android/RastreadorVeicular/app/google-services.json
      - name: Build debug APK
        working-directory: android/RastreadorVeicular
        run: gradle assembleDebug --no-daemon
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rastreador-veicular-debug-apk
          path: android/RastreadorVeicular/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
